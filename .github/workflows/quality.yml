name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: arc-runner-clawtask

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential python3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: React Doctor diff
        if: github.event_name == 'pull_request'
        run: npx -y react-doctor@latest . --verbose --diff
