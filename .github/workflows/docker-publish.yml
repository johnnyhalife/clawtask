name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: arc-runner-clawtask

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner has no Docker daemon. buildx uses the BuildKit service (apex
      # charts/buildkit) with the client certificate that the runner mounts.
      # build-push-action then builds on this current builder.
      - name: Use the cluster BuildKit
        run: |
          docker buildx create --name cluster --driver remote --use \
            --driver-opt "cacert=$BUILDKIT_CERTS/ca.crt,cert=$BUILDKIT_CERTS/tls.crt,key=$BUILDKIT_CERTS/tls.key" \
            "$BUILDKIT_ENDPOINT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: johnnyhalife/clawtask:latest
